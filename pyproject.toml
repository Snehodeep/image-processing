[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "burstclean"
dynamic = ["version"]
description = "Turn a burst of noisy camera frames into one clean image: keep the sharpest, align, average."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Snehodeep Banik" }]
keywords = ["opencv", "image-enhancement", "denoising", "burst", "multi-frame", "webcam", "ocr", "document"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Snehodeep/image-processing"
Issues = "https://github.com/Snehodeep/image-processing/issues"

[project.scripts]
burstclean = "burstclean.cli:main"

[tool.hatch.version]
path = "src/burstclean/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/burstclean"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
